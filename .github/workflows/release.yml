name: Release

# Publishes dailygames.koplugin.zip as a GitHub release, either by pushing a
# tag like v1.0.0 or by running this workflow by hand with a version, then
# refreshes the ZenPM package source in zenpm/ so ZenPM offers the update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: for t in tests/test_*.lua; do luajit tests/run.lua "$t"; done
      - name: Build zip
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir -p build/dailygames.koplugin
          cp -r _meta.lua main.lua dailygames README.md build/dailygames.koplugin/
          # Stamp the version into _meta.lua so KOReader and ZenPM can see it.
          sed -i "s/^    name = \"dailygames\",/&\n    version = \"${TAG#v}\",/" build/dailygames.koplugin/_meta.lua
          grep -q "version = \"${TAG#v}\"" build/dailygames.koplugin/_meta.lua
          cd build && zip -r ../dailygames.koplugin.zip dailygames.koplugin
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: dailygames.koplugin.zip
          generate_release_notes: true
      - name: Update ZenPM source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          git fetch origin main
          git checkout main
          python3 .github/scripts/zenpm_manifest.py
          git add zenpm
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "ZenPM source: $TAG"
          git push origin main
